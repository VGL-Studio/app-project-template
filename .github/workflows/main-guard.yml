# Gác nhánh chính (ADR-0010). Chạy lại cổng chất lượng trên JVM sau mỗi lần nhánh chính thay đổi.
# Nếu đỏ: tạo issue gắn nhãn main-broken (phiên tự chạy và merge-if-green.sh sẽ dừng)
# và đẩy sẵn nhánh revert/<commit> chứa commit revert.
# Thay đổi file này là plan rủi ro cao, bắt buộc duyệt chéo.
name: main-guard

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: main-guard
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cổng chất lượng (scripts/check.sh)
        run: scripts/check.sh 2>&1 | tee build.log

      - name: Đánh dấu nhánh chính đang đỏ
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA::7}"
          branch="revert/${short}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          if git revert --no-edit "${GITHUB_SHA}" && git push origin "${branch}"; then
            revert_note="Nhánh \`${branch}\` đã có sẵn commit revert. Mở PR từ nhánh này nếu quyết định revert."
          else
            revert_note="Không tự revert được, cần sửa tay."
          fi
          gh label create main-broken --color B60205 --description "Nhánh chính không qua cổng chất lượng" --force
          {
            echo "Commit ${GITHUB_SHA} làm nhánh chính không qua cổng chất lượng."
            echo
            echo "${revert_note}"
            echo
            echo "Khi issue này còn mở, phiên tự chạy dừng và \`scripts/merge-if-green.sh\` từ chối mọi PR, trừ PR từ nhánh \`revert/\`."
            echo "Đóng issue sau khi nhánh chính xanh trở lại."
            echo
            echo '```'
            tail -n 60 build.log
            echo '```'
          } > body.md
          gh issue create --title "main-broken: ${short}" --label main-broken --body-file body.md
