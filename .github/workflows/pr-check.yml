# Cổng chất lượng cho mọi PR vào nhánh chính (ADR-0002, ADR-0010).
# Tên các job (changes, build-and-test, ui-test) được scripts/merge-if-green.sh kiểm tra: đổi tên phải sửa cả hai nơi.
# Thay đổi file này là plan rủi ro cao, bắt buộc duyệt chéo.
name: pr-check

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Bắt buộc: shell bash có pipefail, để `lệnh | tee log` vẫn báo lỗi khi lệnh thất bại.
defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # code: mọi thứ ảnh hưởng tới build hoặc tới cổng chất lượng.
          # ui: mọi thứ chạy trong app hoặc ảnh hưởng tới cách app được build (kể cả core không có giao diện,
          #     vì lỗi ở đó vẫn có thể làm app hỏng lúc khởi động).
          filters: |
            code:
              - 'app/**'
              - 'core/**'
              - 'feature/**'
              - 'build-logic/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - '.editorconfig'
              - 'scripts/check.sh'
              - 'scripts/test-summary.sh'
              - '.github/workflows/pr-check.yml'
            ui:
              - 'app/**'
              - 'core/**'
              - 'feature/**'
              - 'build-logic/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - '.github/workflows/pr-check.yml'

  build-and-test:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Chỉ thay đổi tài liệu
        if: needs.changes.outputs.code != 'true'
        run: echo "PR không chạm vào code, bỏ qua build."

      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v5

      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - if: needs.changes.outputs.code == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Cổng chất lượng (scripts/check.sh)
        if: needs.changes.outputs.code == 'true'
        run: scripts/check.sh 2>&1 | tee build.log

      - name: Lưu báo cáo test và ảnh screenshot
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
            **/src/test/screenshots/*.png

      - name: Bình luận lỗi vào PR
        if: failure() && needs.changes.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### build-and-test thất bại"
            echo
            echo "Task thất bại và lỗi:"
            echo '```'
            grep -E " FAILED$|^e: |Lint error|\.kt:[0-9]+:[0-9]+|error:|What went wrong" -A 6 build.log | head -n 150 || true
            echo '```'
            echo "Cuối log:"
            echo '```'
            tail -n 60 build.log
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file comment.md

  ui-test:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Bật KVM cho emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test trên emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -c 'set -o pipefail; ./gradlew --no-daemon --console=plain :app:connectedStagingDebugAndroidTest 2>&1 | tee ui-test.log'

      - name: Tóm tắt test trên emulator
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=0; f=0
          while IFS= read -r -d '' xml; do
            t=$((t + $(grep -o 'tests="[0-9]*"' "$xml" | head -1 | tr -dc 0-9)))
            f=$((f + $(grep -o 'failures="[0-9]*"' "$xml" | head -1 | tr -dc 0-9)))
          done < <(find app/build/outputs/androidTest-results -name '*.xml' -print0 2>/dev/null)
          echo "::notice title=Tóm tắt test emulator::Test emulator: ${t} test, ${f} lỗi."
          if [ "$t" -eq 0 ]; then
            echo "::error::Không có test nào chạy trên emulator."
            {
              echo "### ui-test: không có test nào chạy"
              echo '```'
              find app/build/outputs -maxdepth 4 2>/dev/null | head -n 40
              echo "---"
              tail -n 60 ui-test.log 2>/dev/null || echo "Không có ui-test.log."
              echo '```'
            } > zero.md
            gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file zero.md
            exit 1
          fi

      - name: Bình luận lỗi vào PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### ui-test thất bại"
            echo '```'
            tail -n 80 ui-test.log 2>/dev/null || echo "Không có log."
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file comment.md
