# Quality gate for every PR into main (ADR-0002, ADR-0010).
# Job names (changes, build-and-test, ui-test) are checked by scripts/merge-if-green.sh: rename in both places.
# Changing this file is a high-risk plan and needs cross-review.
name: pr-check

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Required: bash with pipefail, so `command | tee log` still fails when the command fails.
defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ui: ${{ steps.filter.outputs.ui }}
    # No checkout needed: on pull_request events paths-filter reads the changed files from the API.
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # code: anything that affects the build or the quality gate itself.
          # ui: anything that runs in the app or changes how it is built (core modules without UI too,
          #     since a bug there can still crash the app at startup).
          filters: |
            code:
              - 'app/**'
              - 'core/**'
              - 'feature/**'
              - 'build-logic/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - '.editorconfig'
              - 'scripts/check.sh'
              - 'scripts/test-summary.sh'
              - 'scripts/tests/**'
              - 'scripts/find-breaking-commit.sh'
              - '.github/workflows/pr-check.yml'
            ui:
              - 'app/**'
              - 'core/**'
              - 'feature/**'
              - 'build-logic/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'scripts/test-summary.sh'
              - '.github/workflows/pr-check.yml'

  build-and-test:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Chỉ thay đổi tài liệu
        if: needs.changes.outputs.code != 'true'
        run: echo "PR không chạm vào code, bỏ qua build."

      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v5

      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - if: needs.changes.outputs.code == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Cổng chất lượng (scripts/check.sh)
        if: needs.changes.outputs.code == 'true'
        run: scripts/check.sh 2>&1 | tee build.log

      - name: Lưu báo cáo test và ảnh screenshot
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
            **/src/test/screenshots/*.png

      - name: Bình luận lỗi vào PR
        if: failure() && needs.changes.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### build-and-test thất bại"
            echo
            echo "Task thất bại và lỗi:"
            echo '```'
            grep -E " FAILED$|^e: |Lint error|\.kt:[0-9]+:[0-9]+|error:|What went wrong" -A 6 build.log | head -n 150 || true
            echo '```'
            echo "Cuối log:"
            echo '```'
            tail -n 60 build.log
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file comment.md

  ui-test:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Bật KVM cho emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test trên emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -c 'set -o pipefail; ./gradlew --no-daemon --console=plain :app:connectedStagingDebugAndroidTest 2>&1 | tee ui-test.log'

      - name: Tóm tắt test trên emulator
        if: always()
        run: scripts/test-summary.sh android 2>&1 | tee ui-summary.log

      - name: Bình luận lỗi vào PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### ui-test thất bại"
            echo '```'
            cat ui-summary.log 2>/dev/null || echo "Không có tóm tắt test."
            echo "---"
            tail -n 80 ui-test.log 2>/dev/null || echo "Không có log."
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file comment.md
