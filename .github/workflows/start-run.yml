# Starts an auto-run session (docs/auto-run.md, ADR-0049) by firing the Claude Code routine API.
# Two ways to run: by hand (Run workflow, with the run file), or on a push to main that changes docs/runs/RUN-*.md,
# when that push moves a list with "start: auto" and "open_with: routine" to approved (scripts/auto-start-check.py).
# Any developer can start a session from GitHub without signing in to the Claude account that owns the routine.
# Secrets (added by people, never read or printed by AI):
#   ROUTINE_FIRE_URL    https://api.anthropic.com/v1/claude_code/routines/<trig_ id>/fire, from the routine's API trigger
#   ROUTINE_FIRE_TOKEN  bearer token of that trigger; it can only start this one routine
# Before firing, scripts/setup-check.sh --staging also reads the staging secrets of staging.yml
# (STAGING_GOOGLE_SERVICES_JSON, STAGING_APP_DISTRIBUTION_CREDENTIALS) and the STAGING_TESTER_GROUPS variable.
# A green check closes an open setup-broken issue before the routine is fired, so the session does not stop on an
# old one (L-113). Four jobs: pick (chooses the run list), check, close-setup-broken (the only one with issues: write),
# fire (the only one that may write Actions: it enables the schedules of resume-run.yml and run-watchdog.yml for the
# session, T-051). A push that approves no list stops after pick, green.
# Against two sessions: pick, and fire again just before the API call, refuse a list no longer approved on main, a
# list with a report branch, another running list, or another fire job holding a session (scripts/auto-start-check.py;
# the force input skips the last one). check and fire wait in the start-run concurrency group with resume-run.yml.
# auto-start-check.py finds fire jobs by the job name "fire <run file>" and the step name "Kích hoạt routine": keep both.
# The fire endpoint is a research preview behind a beta header, so its contract may still change.
# It has no idempotency key: every successful call starts a new session, so it is never retried.
# Changing this file is a high-risk plan; cross-review required.
name: start-run

on:
  push:
    branches: [main]
    paths: ['docs/runs/RUN-*.md']
  workflow_dispatch:
    inputs:
      run_file:
        description: Danh sách chạy đã duyệt, ví dụ docs/runs/RUN-20261015-01.md
        required: true
      force:
        description: Bỏ qua kiểm tra "vừa kích hoạt một phiên"; mở lại phiên của chính danh sách khi nhánh báo cáo đang running. Chỉ dùng khi biết chắc phiên trước không bắt đầu.
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read
  issues: read
  checks: read
  # main-guard-status.sh reads when a pending main-guard run was created (Actions API); without it the time is unknown.
  actions: read

jobs:
  # Chooses the run list: on a push, the one this push approved with start auto; by hand, the input. No concurrency
  # here, so a push that approves nothing never waits in, or cancels a run waiting in, the start-run group.
  pick:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_file: ${{ steps.choose.outputs.run_file }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Chọn danh sách chạy
        id: choose
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          RUN_FILE_INPUT: ${{ inputs.run_file }}
          FORCE: ${{ inputs.force }}
        run: |
          code=0
          if [ "${EVENT}" = "push" ]; then
            out="$(python3 -I scripts/auto-start-check.py push --before "${BEFORE}" --after "${GITHUB_SHA}" 2> "${RUNNER_TEMP}/pick.err")" || code=$?
          else
            force=()
            if [ "${FORCE}" = "true" ]; then force=(--force); fi
            out="$(python3 -I scripts/auto-start-check.py dispatch "${RUN_FILE_INPUT}" ${force[@]+"${force[@]}"} 2> "${RUNNER_TEMP}/pick.err")" || code=$?
          fi
          cat "${RUNNER_TEMP}/pick.err" >&2
          {
            echo "### Chọn danh sách chạy"
            echo
            sed 's/^/- /' "${RUNNER_TEMP}/pick.err"
          } >> "${GITHUB_STEP_SUMMARY}"
          case "${code}" in
            0) ;;
            3)
              echo "::error::Không bắt đầu phiên: $(tail -n 1 "${RUNNER_TEMP}/pick.err")"
              exit 1
              ;;
            *)
              echo "::error::Không chọn được danh sách chạy (mã ${code}). Lý do ở log của bước này."
              exit 1
              ;;
          esac
          if [[ "${out}" =~ ^docs/runs/RUN-[0-9]{8}-[0-9]{2}\.md$ ]]; then
            echo "run_file=${out}" >> "${GITHUB_OUTPUT}"
          fi

  check:
    needs: pick
    if: needs.pick.outputs.run_file != ''
    runs-on: ubuntu-latest
    # Up to 20 minutes waiting for a running main-guard on a push.
    timeout-minutes: 30
    # Only one session at a time (docs/auto-run.md, section 1), shared with resume-run.yml.
    concurrency:
      group: start-run
      cancel-in-progress: false
    outputs:
      run_file: ${{ needs.pick.outputs.run_file }}
    steps:
      - uses: actions/checkout@v5
        with:
          # No token in .git/config: an app's own setup checks may run third-party tools (L-113).
          persist-credentials: false

      - name: Kiểm tra trước khi bắt đầu phiên
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_FILE: ${{ needs.pick.outputs.run_file }}
        run: |
          if ! [[ "${RUN_FILE}" =~ ^docs/runs/RUN-[0-9]{8}-[0-9]{2}\.md$ ]]; then
            echo "::error::Đường dẫn danh sách chạy phải có dạng docs/runs/RUN-YYYYMMDD-NN.md."
            exit 1
          fi
          if [ ! -f "${RUN_FILE}" ]; then
            echo "::error::Không có ${RUN_FILE} trên nhánh chính. Danh sách chạy phải được merge trước."
            exit 1
          fi
          status="$(sed -n '/^---$/,/^---$/s/^status:[[:space:]]*\([a-z]*\).*/\1/p' "${RUN_FILE}" | head -n 1)"
          if [ "${status}" != "approved" ]; then
            echo "::error::${RUN_FILE} có trạng thái '${status}'. Chỉ bắt đầu phiên với danh sách chạy approved."
            exit 1
          fi

          # The session checks this too, but failing here saves a session that would stop at once.
          open_broken="$(gh issue list --label main-broken --state open --json number --jq 'length')"
          if [ "${open_broken}" != "0" ]; then
            echo "::error::Nhánh chính đang đỏ (có issue main-broken đang mở). Không bắt đầu phiên."
            exit 1
          fi

          # Opened by the daily env-canary check: a session in this environment would stop on downloads.
          open_env="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=env-broken&per_page=10" --jq 'length')"
          if [ "${open_env}" != "0" ]; then
            echo "::error::Môi trường cloud đang lỗi (có issue env-broken đang mở). Sửa môi trường, chạy lại workflow env-canary, rồi bắt đầu phiên."
            exit 1
          fi

      # main-guard passed on the newest commit of main with code. No issue is opened when GitHub sends no push
      # event for a merge (app lesson L-054 of camera-pose), so the main-broken check above lets such a commit
      # through (L-076).
      - name: Kiểm tra main-guard trên nhánh chính
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          # A run list is often merged right after code: on a push, wait while main-guard still runs (exit 2).
          if [ "${EVENT}" = "push" ]; then
            for attempt in $(seq 1 20); do
              code=0
              GITHUB_ACTIONS= scripts/main-guard-status.sh "${GITHUB_SHA}" || code=$?
              if [ "${code}" != "2" ]; then
                break
              fi
              echo "main-guard còn chạy, chờ 60 giây (lần ${attempt}/20)."
              sleep 60
            done
          fi
          scripts/main-guard-status.sh "${GITHUB_SHA}"

      # What otherwise fails only at the end of the session (device-session.yml, staging.yml) or in the first
      # emulator test: fake or wrong Firebase staging secret, missing tester group, missing R2 files, DNS of the
      # static file host (app lessons L-002, L-011, L-012, L-027 of camera-pose). Checked here, on a GitHub runner,
      # because the cloud environment of the session cannot reach R2. Secret values are never printed.
      - name: Kiểm tra thiết lập staging, file R2 và DNS
        env:
          GOOGLE_SERVICES: ${{ secrets.STAGING_GOOGLE_SERVICES_JSON }}
          DISTRIBUTION_CREDENTIALS: ${{ secrets.STAGING_APP_DISTRIBUTION_CREDENTIALS }}
          STAGING_TESTER_GROUPS: ${{ vars.STAGING_TESTER_GROUPS || 'team' }}
        run: |
          # No GitHub token next to the checks: an app's own checks may run third-party tools (L-113).
          if ! env -u GH_TOKEN -u GITHUB_TOKEN scripts/setup-check.sh --staging; then
            echo "::error::Thiết lập chưa đủ cho một phiên: phiên sẽ dừng ở cuối (bản staging) hoặc ở test emulator đầu tiên. Sửa các lỗi trên (docs/ops/staging-and-runs.md, docs/ops/setup-new-app.md) rồi bắt đầu lại."
            exit 1
          fi

  # The setup check above is green: an open setup-broken issue is old (the problem is gone, or it was an R2 hiccup).
  # Close it, as the morning check of env-canary.yml would, before the routine starts: the session stops at its start
  # while one is open (docs/auto-run.md, section 2). A job of its own, so issues: write is not on the workflow. A
  # failure to close only warns (L-113).
  close-setup-broken:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Đóng issue setup-broken cũ
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for number in $(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=setup-broken&per_page=10" --jq '.[].number' || true); do
            { gh api "repos/${GITHUB_REPOSITORY}/issues/${number}/comments" -X POST \
                -f body="Kiểm tra thiết lập của start-run xanh trên \`${GITHUB_SHA::7}\`. Đóng mục này." > /dev/null &&
              gh api "repos/${GITHUB_REPOSITORY}/issues/${number}" -X PATCH -f state=closed > /dev/null; } ||
              echo "::warning::không đóng được issue ${number}"
          done

  fire:
    name: fire ${{ needs.check.outputs.run_file }}
    needs: [check, close-setup-broken]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: start-run
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # pick checked before the queue; a run that fired meanwhile is seen only here, inside the start-run group.
      - name: Kiểm tra lại ngay trước khi kích hoạt
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_FILE: ${{ needs.check.outputs.run_file }}
          FORCE: ${{ inputs.force }}
        run: |
          force=()
          if [ "${FORCE}" = "true" ]; then force=(--force); fi
          code=0
          out="$(python3 -I scripts/auto-start-check.py dispatch "${RUN_FILE}" --recheck ${force[@]+"${force[@]}"})" || code=$?
          if [ "${code}" != "0" ] || [ "${out}" != "${RUN_FILE}" ]; then
            echo "::error::Không kích hoạt phiên: kiểm tra lại trước khi gọi API không qua (mã ${code}). Lý do ở log của bước này."
            exit 1
          fi

      # The schedules turn themselves off while no session runs (scripts/schedule-idle.py). Turned on before the
      # routine, so the session is watched and continued from its start. A failure only warns: the session enables
      # them again at its start.
      - name: Bật lịch của phiên
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/resume-run.yml/enable" > /dev/null ||
            echo "::warning::Không bật được lịch resume-run.yml. Phiên sẽ thử bật ở đầu phiên."
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/run-watchdog.yml/enable" > /dev/null ||
            echo "::warning::Không bật được lịch run-watchdog.yml. Phiên sẽ thử bật ở đầu phiên."

      - name: Kích hoạt routine
        env:
          FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
          RUN_FILE: ${{ needs.check.outputs.run_file }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "${FIRE_URL}" ] || [ -z "${FIRE_TOKEN}" ]; then
            echo "::error::Thiếu bí mật ROUTINE_FIRE_URL hoặc ROUTINE_FIRE_TOKEN. Xem docs/ops/staging-and-runs.md."
            exit 1
          fi

          # The routine's own prompt reads the run file named in this text (docs/ops/staging-and-runs.md).
          how="bấm tay"
          if [ "${EVENT}" = "push" ]; then how="tự động khi danh sách approved lên nhánh chính"; fi
          payload="$(jq -n --arg file "${RUN_FILE}" --arg actor "${ACTOR}" --arg how "${how}" \
            '{text: ("Danh sách chạy: " + $file + "\nNgười kích hoạt: " + $actor + "\nCách bắt đầu: " + $how)}')"

          # The token goes through a header file, so it never appears in the command line.
          umask 077
          printf 'Authorization: Bearer %s\n' "${FIRE_TOKEN}" > "${RUNNER_TEMP}/auth-header"
          status="$(curl -sS -o response.json -w '%{http_code}' -X POST "${FIRE_URL}" \
            -H @"${RUNNER_TEMP}/auth-header" \
            -H 'anthropic-version: 2023-06-01' \
            -H 'anthropic-beta: experimental-cc-routine-2026-04-01' \
            -H 'Content-Type: application/json' \
            -d "${payload}")" || status="000"
          rm -f "${RUNNER_TEMP}/auth-header"

          if [ "${status}" != "200" ]; then
            message="$(jq -r '.error.message // empty' response.json 2>/dev/null || true)"
            case "${status}" in
              401) hint="Mã kích hoạt sai hoặc đã bị tạo lại." ;;
              404) hint="Routine không tồn tại, kiểm tra ROUTINE_FIRE_URL." ;;
              400) hint="Routine đang tạm dừng hoặc yêu cầu không hợp lệ." ;;
              429) hint="Đã vượt giới hạn số lần kích hoạt mỗi giờ, thử lại sau." ;;
              000) hint="Không kết nối được tới API." ;;
              *) hint="Lỗi phía API, thử lại sau ít phút." ;;
            esac
            echo "::error::Không bắt đầu được phiên (HTTP ${status}). ${hint} ${message}"
            exit 1
          fi

          session_url="$(jq -r '.claude_code_session_url // empty' response.json)"
          {
            echo "### Phiên tự chạy đã bắt đầu"
            echo
            echo "- Danh sách chạy: \`${RUN_FILE}\`"
            echo "- Người kích hoạt: ${ACTOR}"
            echo "- Phiên: ${session_url:-API không trả về đường dẫn}"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Phiên: ${session_url}"
